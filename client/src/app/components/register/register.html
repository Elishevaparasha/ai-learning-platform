<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light" dir="rtl">
  <div class="card shadow-lg border-0 rounded-4 p-5" style="width: 100%; max-width: 460px;">
    <div class="text-center mb-4">
      <div class="display-4 mb-2">✨</div>
      <h1 class="h3 fw-bold text-primary">הצטרף לפלטפורמה</h1>
      <p class="text-muted">צור חשבון חדש ותתחיל ללמוד</p>
    </div>

    <div *ngIf="error" class="alert alert-danger rounded-3">{{ error }}</div>
    <div *ngIf="success" class="alert alert-success rounded-3">{{ success }}</div>

    <div class="mb-3">
      <label class="form-label fw-semibold">שם מלא <span class="text-danger">*</span></label>
      <input type="text" class="form-control form-control-lg rounded-3" [(ngModel)]="name" placeholder="ישראל ישראלי" />
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">טלפון</label>
      <input type="tel" class="form-control form-control-lg rounded-3" [(ngModel)]="phone" placeholder="050-0000000" />
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">אימייל <span class="text-danger">*</span></label>
      <input type="email" class="form-control form-control-lg rounded-3" [(ngModel)]="email" placeholder="your@email.com" />
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold">סיסמה <span class="text-danger">*</span></label>
      <input type="password" class="form-control form-control-lg rounded-3" [(ngModel)]="password" placeholder="••••••••" (keyup.enter)="register()" />
    </div>

    <button class="btn btn-primary btn-lg w-100 rounded-3 fw-bold" (click)="register()" [disabled]="loading">
      <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
      {{ loading ? 'נרשם...' : 'הירשם' }}
    </button>

    <p class="text-center mt-4 text-muted">
      כבר יש לך חשבון? <a routerLink="/login" class="text-primary fw-semibold text-decoration-none">התחבר</a>
    </p>
  </div>
</div>
