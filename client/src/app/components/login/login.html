<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light" dir="rtl">
  <div class="card shadow-lg border-0 rounded-4 p-5" style="width: 100%; max-width: 420px;">
    <div class="text-center mb-4">
      <div class="display-4 mb-2">🧠</div>
      <h1 class="h3 fw-bold text-primary">AI Learning Platform</h1>
      <p class="text-muted">התחבר לחשבונך</p>
    </div>

    <div *ngIf="error" class="alert alert-danger rounded-3">{{ error }}</div>

    <div class="mb-3">
      <label class="form-label fw-semibold">אימייל</label>
      <input type="email" class="form-control form-control-lg rounded-3" [(ngModel)]="email" placeholder="your@email.com" />
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold">סיסמה</label>
      <input type="password" class="form-control form-control-lg rounded-3" [(ngModel)]="password" placeholder="••••••••" (keyup.enter)="login()" />
    </div>

    <button class="btn btn-primary btn-lg w-100 rounded-3 fw-bold" (click)="login()" [disabled]="loading">
      <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
      {{ loading ? 'מתחבר...' : 'התחבר' }}
    </button>

    <p class="text-center mt-4 text-muted">
      אין לך חשבון? <a routerLink="/register" class="text-primary fw-semibold text-decoration-none">הירשם עכשיו</a>
    </p>
  </div>
</div>
